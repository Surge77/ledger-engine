spring:
  application:
    name: ledger-engine
  threads:
    # Virtual threads (Java 21): request handling and the retry-backoff sleep no
    # longer pin platform threads under contention.
    virtual:
      enabled: true
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USER}
    password: ${LEDGER_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${LEDGER_DB_POOL_SIZE:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${LEDGER_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The outbox payload column is already JSON — send it as-is rather than
      # serializing a String into a nested JSON string.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Durability over latency: the outbox exists so a committed ledger post is
      # never lost, and an unacknowledged send would defeat that.
      acks: all
      properties:
        enable.idempotence: true
    template:
      # Emits a producer span and writes W3C traceparent into the record headers.
      # Without this the trace ends at the ledger and fraud-engine starts a new
      # one -- two orphan traces, and no error to tell you.
      observation-enabled: true

  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${LEDGER_PORT:8080}

ledger:
  api-key: ${LEDGER_API_KEY}
  scheduling:
    enabled: ${LEDGER_SCHEDULING_ENABLED:true}
  outbox:
    poll-interval-ms: ${LEDGER_OUTBOX_POLL_MS:2000}
    batch-size: ${LEDGER_OUTBOX_BATCH:100}
    # 'log' needs no broker; set to 'kafka' to publish to ledger.transfers.posted
    publisher: ${LEDGER_OUTBOX_PUBLISHER:log}
    send-timeout-ms: ${LEDGER_OUTBOX_SEND_TIMEOUT_MS:5000}
  reconciliation:
    interval-ms: ${LEDGER_RECON_INTERVAL_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      # Publish histogram buckets so Grafana can compute p95/p99 via histogram_quantile.
      percentiles-histogram:
        # http.server.requests already carries per-URI latency, which is what the
        # write-latency SLO is computed from. A separate transfer timer would be a
        # second source of truth for the same number.
        http.server.requests: true
    tags:
      # Lets one Prometheus/Grafana stack scrape both services and tell them apart.
      application: ${spring.application.name}
  tracing:
    sampling:
      # Full sampling: this is a demonstrable platform, not a high-volume production
      # system, and a partial sample makes an injected fault easy to miss entirely.
      probability: ${LEDGER_TRACE_SAMPLE:1.0}
  otlp:
    tracing:
      endpoint: ${LEDGER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  pattern:
    # trace/span ids make a log line joinable to its Grafana waterfall.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId}] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
  level:
    dev.ledger: INFO
